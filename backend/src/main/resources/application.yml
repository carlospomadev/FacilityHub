spring:
  application:
    name: facilityhub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facilityhub}
    username: ${DB_USERNAME:facilityhub}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: facilityhub
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    schemas: facilityhub
    default-schema: facilityhub
  servlet:
    multipart:
      max-file-size: ${FACILITYHUB_MAX_FILE_SIZE:20MB}
      max-request-size: ${FACILITYHUB_MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # FH-005A2-E: solo el estado agregado, sin detalles ni componentes, tambien para usuarios autenticados.
      show-details: never
      show-components: never
      # Sin grupos liveness/readiness (activos por defecto en Boot 4): la raiz solo devuelve "status".
      probes:
        enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

facilityhub:
  storage:
    root: ${FACILITYHUB_STORAGE_ROOT:./storage/documents}
  # FH-006 / P6-D2: recordatorios de vencimiento. La tarea programada esta DESACTIVADA por defecto.
  recordatorios:
    enabled: ${FACILITYHUB_RECORDATORIOS_ENABLED:false}
    cron: ${FACILITYHUB_RECORDATORIOS_CRON:0 0 7 * * *}
    preaviso-dias: 15
    cadencia-vencido-dias: 7
    antiguedad-maxima-dias: 90
