spring:
  application:
    name: facilityhub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facilityhub}
    username: ${DB_USERNAME:facilityhub}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: facilityhub
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    schemas: facilityhub
    default-schema: facilityhub

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

facilityhub:
  storage:
    root: ${FACILITYHUB_STORAGE_ROOT:./storage/documents}
