services:
  postgres:
    image: postgres:18.6
    container_name: facilityhub-postgres
    environment:
      POSTGRES_DB: facilityhub
      POSTGRES_USER: facilityhub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - facilityhub_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilityhub -d facilityhub"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facilityhub-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/facilityhub
      DB_USERNAME: facilityhub
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FACILITYHUB_STORAGE_ROOT: /app/storage/documents
    ports:
      - "8080:8080"
    volumes:
      - facilityhub_documents:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  facilityhub_pgdata:
  facilityhub_documents:
